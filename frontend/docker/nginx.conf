server {
    listen       5173;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml text/xml;
    gzip_min_length 256;
    gzip_vary on;

    # ---------- Static assets (content-hashed, cache forever) ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- Widget embed files (no hash — short cache + etag) ----------
    location = /weauth.js {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        etag on;
    }

    location = /weauth.css {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        etag on;
    }

    # ---------- Widget standalone demo page ----------
    location = /widget.html {
        expires 1h;
        add_header Cache-Control "no-cache, must-revalidate";
    }


    # ---------- SPA — serve index.html for all other routes ----------
    location / {
        try_files $uri $uri/ /index.html;

        # HTML should not be cached aggressively
        location ~ \.html$ {
            expires 1h;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}

