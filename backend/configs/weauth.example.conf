; =============================================================================
; weauth.conf — WeAuth Backend Configuration
; =============================================================================
; This file uses INI format with [#] and [;] comment lines.
; The config loader checks paths in this order (later overrides earlier):
;   1. Hardcoded defaults (see internal/config/types/*.go)
;   2. /etc/weauth/weauth.conf
;   3. ~/.config/weauth/weauth.conf
;   4. $WEAUTH_HOME/conf/weauth.conf
;   5. --config CLI argument
;   6. WEAUTH_* environment variables
;
; Copy this file to one of the above locations and edit as needed,
; or pass it directly via --config /path/to/weauth.conf
; =============================================================================

; ---------------------------------------------------------------------------
; [server] — HTTP server settings
; ---------------------------------------------------------------------------
; Code defaults: listen=127.0.0.1, port=8080, mode=release, log_file=logs/app.log
; ---------------------------------------------------------------------------
[server]
listen                  = 0.0.0.0
port                    = 8080
mode                    = debug
log_file                = logs/weauth.log

; ---------------------------------------------------------------------------
; [database] — PostgreSQL connection and pool settings
; ---------------------------------------------------------------------------
; Code defaults: user=postgres, password=admin123, db_name=pow_verify, ...
; ---------------------------------------------------------------------------
[database]
host                    = 127.0.0.1
port                    = 5432
user                    = weauth
password                = admin123
db_name                 = weauth
db_mode                 = debug
max_idle_conns          = 10
max_open_conns          = 100
conn_max_lifetime_minute = 30
conn_max_idle_minute    = 5

; ---------------------------------------------------------------------------
; [jwt] — JWT signing and expiry
; ---------------------------------------------------------------------------
; Code defaults: secret=default-secret-please-change, expire_hours=24
; ---------------------------------------------------------------------------
[jwt]
secret                  = default-secret-please-change
expire_hours            = 24

; ---------------------------------------------------------------------------
; [oidc] — OpenID Connect provider integration
; ---------------------------------------------------------------------------
; Code defaults: frontend_url=http://localhost:5173
; ---------------------------------------------------------------------------
[oidc]
client_id               = 
client_secret           = 
discovery_url           = https://your-oidc-provider/api/.well-known/openid-configuration
redirect_url            = http://localhost:8080/api/auth/oidc/callback
frontend_url            = http://localhost:5173

; ---------------------------------------------------------------------------
; [cors] — Cross-Origin Resource Sharing
; ---------------------------------------------------------------------------
; Code defaults:
;   allow_origins     = http://localhost:5173
;   allow_methods     = GET,POST,PUT,PATCH,DELETE,OPTIONS
;   allow_headers     = Origin,Content-Type,Accept,Authorization
;   expose_headers    = Content-Length
;   allow_credentials = true
; ---------------------------------------------------------------------------
[cors]
allow_origins           = http://localhost:5173
allow_methods           = GET,POST,PUT,PATCH,DELETE,OPTIONS
allow_headers           = Origin,Content-Type,Accept,Authorization
expose_headers          = Content-Length
allow_credentials       = true

; ---------------------------------------------------------------------------
; [ratelimit] — 站点级请求频率限制
; ---------------------------------------------------------------------------
; time_window_seconds: 统计窗口（秒），默认 30
; request_limit:      窗口内每个站点允许的最大请求次数，默认 500
; ---------------------------------------------------------------------------
[ratelimit]
time_window_seconds     = 30
request_limit           = 500
